name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate feature suggestions. Please describe what you need and why.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Campaigns (YAML schema, validation, linting)
        - Policies (DSL, evaluation, agent rules)
        - Gap analysis (reports, risk scoring)
        - Agent (inventory, trust, attestation, profiling, chain analysis)
        - Compliance (framework mapping, NIST, CIS, OWASP)
        - Risk (posture, STRIDE threat model, attack trees)
        - Sigma (rule generation, logsource mapping)
        - Deploy (SSH, WinRM, agent, orchestrator)
        - Trace (replay, correlation, anomaly detection)
        - Scenario engine (YAML test cases, pass criteria)
        - Dashboard (HTML reports, executive summaries)
        - Templates (campaign and policy scaffolds)
        - Output formats (SARIF, JUnit, JSON, HTML, Markdown)
        - Navigator (ATT&CK layer export)
        - CLI (commands, flags, help)
        - CI integration (GitHub Actions, pipelines)
        - MITRE frameworks (ATT&CK, ATLAS, OWASP LLM)
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? What workflow is missing or painful?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think it should work? Include example CLI usage if applicable.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that would help us understand the request.
