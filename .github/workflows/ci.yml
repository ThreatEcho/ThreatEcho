# --------------------------------------------------------------------------
# ThreatEcho CI Pipeline
#
# Jobs:
#   test           — vet, race-detected tests, coverage upload
#   lint-campaigns — validate campaign manifests + lint rules
#   gap-analysis   — gap analysis with SARIF (Code Scanning) + JUnit reports
#   policy-eval    — policy evaluation with SARIF + JUnit reports
#   build          — cross-compile matrix (linux/darwin/windows × amd64/arm64)
#   release        — GoReleaser on tag push (v*)
# --------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  GOFLAGS: '-buildvcs=false'
  BINARY: bin/threatecho

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # Test — vet, race tests, coverage
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -s -l . 2>&1)" || { echo "Files need gofmt:"; gofmt -s -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test (race, coverage)
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────────
  # Lint campaigns — validate manifests + lint rules
  # ──────────────────────────────────────────────────────────────────────────
  lint-campaigns:
    name: Lint Campaigns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: |
          VERSION="${GITHUB_SHA::8}"
          go build -ldflags "-s -w \
            -X github.com/ThreatEcho/threatecho/pkg/version.Version=${VERSION} \
            -X github.com/ThreatEcho/threatecho/pkg/version.Commit=${GITHUB_SHA::8} \
            -X github.com/ThreatEcho/threatecho/pkg/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ${{ env.BINARY }} ./cmd/threatecho/

      - name: Validate all campaigns
        run: |
          for dir in campaigns/*/; do
            ./${{ env.BINARY }} validate "$dir"
          done

      - name: Lint all campaigns
        run: ./${{ env.BINARY }} lint -dir campaigns/ || true

      - name: Validate all policies
        run: |
          for dir in policies/*/; do
            ./${{ env.BINARY }} policy validate "$dir"
          done

  # ──────────────────────────────────────────────────────────────────────────
  # Gap analysis — SARIF for Code Scanning + JUnit test report
  # ──────────────────────────────────────────────────────────────────────────
  gap-analysis:
    name: Gap Analysis
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write    # required for SARIF upload
      checks: write             # required for JUnit test report
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: |
          VERSION="${GITHUB_SHA::8}"
          go build -ldflags "-s -w \
            -X github.com/ThreatEcho/threatecho/pkg/version.Version=${VERSION} \
            -X github.com/ThreatEcho/threatecho/pkg/version.Commit=${GITHUB_SHA::8} \
            -X github.com/ThreatEcho/threatecho/pkg/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ${{ env.BINARY }} ./cmd/threatecho/

      - name: Run gap analysis (SARIF)
        run: ./${{ env.BINARY }} gap -format sarif -dir campaigns/ > results.sarif

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true   # Code Scanning may not be enabled on all repos
        with:
          sarif_file: results.sarif
          category: gap-analysis

      - name: Run gap analysis (JUnit)
        run: ./${{ env.BINARY }} gap -format junit -dir campaigns/ > gap-results.xml

      - name: Upload JUnit test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Gap Analysis Results
          path: gap-results.xml
          reporter: java-junit
          fail-on-error: 'false'

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: gap-analysis-sarif
          path: results.sarif
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # Policy evaluation — SARIF for Code Scanning + JUnit test report
  # ──────────────────────────────────────────────────────────────────────────
  policy-eval:
    name: Policy Evaluation
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write    # required for SARIF upload
      checks: write             # required for JUnit test report
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        run: |
          VERSION="${GITHUB_SHA::8}"
          go build -ldflags "-s -w \
            -X github.com/ThreatEcho/threatecho/pkg/version.Version=${VERSION} \
            -X github.com/ThreatEcho/threatecho/pkg/version.Commit=${GITHUB_SHA::8} \
            -X github.com/ThreatEcho/threatecho/pkg/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o ${{ env.BINARY }} ./cmd/threatecho/

      # policy eval exits 2 on denied violations (expected in demo campaigns);
      # capture the exit code but don't fail the job
      - name: Run policy evaluation (SARIF)
        run: ./${{ env.BINARY }} policy eval -policy policies/agent-default/ -format sarif -dir campaigns/ > policy.sarif || true

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true   # Code Scanning may not be enabled on all repos
        with:
          sarif_file: policy.sarif
          category: policy-evaluation

      - name: Run policy evaluation (JUnit)
        run: ./${{ env.BINARY }} policy eval -policy policies/agent-default/ -format junit -dir campaigns/ > policy-results.xml || true

      - name: Upload JUnit test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Policy Evaluation Results
          path: policy-results.xml
          reporter: java-junit
          fail-on-error: 'false'

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: policy-eval-sarif
          path: policy.sarif
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # Build matrix — cross-compile for all target platforms
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: test
    if: "!startsWith(github.ref, 'refs/tags/v')"
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME:-${GITHUB_SHA::8}}"
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          LDFLAGS="-s -w \
            -X github.com/ThreatEcho/threatecho/pkg/version.Version=${VERSION} \
            -X github.com/ThreatEcho/threatecho/pkg/version.Commit=${GITHUB_SHA::8} \
            -X github.com/ThreatEcho/threatecho/pkg/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags "${LDFLAGS}" \
            -o bin/threatecho-${GOOS}-${GOARCH}${ext} ./cmd/threatecho/
          go build -ldflags "${LDFLAGS}" \
            -o bin/threatecho-agent-${GOOS}-${GOARCH}${ext} ./cmd/threatecho-agent/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: threatecho-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/threatecho-*
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # Release — publish GitHub release via GoReleaser on tag push
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write    # required for creating GitHub releases
      packages: write    # required for pushing Docker images to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GoReleaser needs full history for changelog

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOFLAGS: ''
