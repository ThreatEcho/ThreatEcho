api_version: v1
kind: Agent

meta:
  name: support-agent
  type: retrieval
  description: "Customer support agent with RAG capabilities. Answers customer queries using the knowledge base, creates support tickets, and escalates complex issues to human operators."
  model: gpt-4
  version: "2.1.0"
  owner: customer-success
  tags: [customer-facing, tier-2, production]

capabilities:
  tool_calling: true
  rag: true
  code_execution: false
  web_access: false
  file_access: false
  message_passing: true
  memory: true
  autonomous: false

tools:
  - name: search_knowledge_base
    actions: [query, semantic_search]
    targets: ["https://kb.internal/api/*"]
  - name: create_ticket
    actions: [create, update]
    targets: ["https://tickets.internal/api/*"]
  - name: send_email
    actions: [send]
    targets: ["*@corp.example.com"]
    rate_limit: 10

trust:
  level: standard
  trusts_from: [orchestrator]
  trusted_by: []
  boundaries: [customer-facing]
  can_escalate: false

guardrails:
  - name: prompt-injection-detector
    type: input
    enforced: true
  - name: pii-filter
    type: output
    enforced: true
  - name: content-safety
    type: content-filter
    enforced: true
